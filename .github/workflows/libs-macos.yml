# Builds mpv and FFmpeg for macOS (LGPL, video, universal) with the Nix build in libs/macos. A run keeps its archives as
# workflow artifacts; a tag named libs-macos-v* also publishes them as a GitHub release, which media_gears_macos
# downloads.
name: libs-macos

on:
  push:
    branches:
      - master
    paths:
      - libs/macos/**
      - .github/workflows/libs-macos.yml
    tags:
      - libs-macos-v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: libs/macos
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      - name: Xcode
        id: xcode
        run: |
          XCODE_PATH=$(realpath "$(xcode-select -p)/../..")
          "$XCODE_PATH/Contents/Developer/usr/bin/xcodebuild" -version
          echo "path=$XCODE_PATH" >> "$GITHUB_OUTPUT"

      - name: Version
        id: version
        run: |
          VERSION=dev
          if [[ "$GITHUB_REF" == refs/tags/libs-macos-* ]]; then
            VERSION="${GITHUB_REF#refs/tags/libs-macos-}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: nix develop -c make XCODE_PATH=${{ steps.xcode.outputs.path }} VERSION=${{ steps.version.outputs.version }}

      # A build that silently produced nothing once passed; the frameworks the plugin needs must be in the archive.
      - name: Check
        run: |
          archive=$(ls result/libmpv-xcframeworks_*_macos-universal-video-default.tar.gz)
          for framework in Mpv Avcodec Avformat Avutil Swscale; do
            tar -tzf "$archive" | grep -q "/$framework.xcframework/" || { echo "missing $framework.xcframework"; exit 1; }
          done

          ls -lh result

      # FFmpeg's programs must run from an app's Contents/MacOS with only the frameworks in Contents/Frameworks, and
      # must have what clipsniff runs them for.
      - name: Check programs
        run: |
          check=$RUNNER_TEMP/check
          mkdir -p $check/zips $check/Contents/MacOS $check/Contents/Frameworks
          for zip in result/*.zip; do
            unzip -q "$zip" -d $check/zips
          done

          cp -R $check/zips/*.xcframework/macos-*/*.framework $check/Contents/Frameworks/
          cp $check/zips/bin/* $check/Contents/MacOS/
          otool -L $check/Contents/MacOS/ffmpeg
          ! otool -l $check/Contents/MacOS/ffmpeg | grep -q /nix/store
          $check/Contents/MacOS/ffprobe -version | head -1
          $check/Contents/MacOS/ffmpeg -hide_banner -filters | grep -E ' (fps|scale|format) '
          $check/Contents/MacOS/ffmpeg -hide_banner -muxers | grep -w rawvideo
          $check/Contents/MacOS/ffmpeg -hide_banner -encoders | grep -w rawvideo

      - uses: actions/upload-artifact@v7
        with:
          name: libs-macos-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            libs/macos/result/*.tar.gz
            libs/macos/result/*.zip

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/libs-macos-')
        with:
          fail_on_unmatched_files: true
          files: |
            libs/macos/result/*.tar.gz
            libs/macos/result/*.zip
