name: media_gears_linux
description: The Linux implementation of media_gears, over the system's libmpv.
version: 0.1.0-dev.1
repository: https://github.com/kamora/media-gears/tree/master/packages/media_gears_linux
issue_tracker: https://github.com/kamora/media-gears/issues
environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    implements: media_gears
    platforms:
      linux:
        pluginClass: MediaGearsPlugin
