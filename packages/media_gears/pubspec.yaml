name: media_gears
description: Video and audio playback for Flutter desktop apps on macOS, Windows and Linux, built on mpv and FFmpeg. A desktop-only fork of media_kit.
version: 0.1.0-dev.1
environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"
resolution: workspace

topics:
  - video
  - video-player
  - audio
  - mpv
  - desktop

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.0
  http: ^1.2.2
  image: ^4.8.0
  media_gears_linux: ^0.1.0-dev.1
  media_gears_macos: ^0.1.0-dev.1
  media_gears_windows: ^0.1.0-dev.1
  meta: ^1.15.0
  path: ^1.9.1
  safe_local_storage: ^2.0.3
  synchronized: ^3.3.0
  universal_platform: ^1.1.0
  uri_parser: ^3.0.2
  uuid: ^4.5.3
  wakelock_plus: ^1.3.0

dev_dependencies:
  flutter_lints: any
  test: any

flutter:
  plugin:
    platforms:
      linux:
        default_package: media_gears_linux
      macos:
        default_package: media_gears_macos
      windows:
        default_package: media_gears_windows
